name: Avatar P2 artwork proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/prototype-avatar-artwork.py'
      - '.github/workflows/avatar-artwork-proof.yml'
      - 'public/avatar/scenes/v2/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-artwork-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artwork:
    name: Generate developer-only artwork proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image QA dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Analyze locked original artwork
        run: python scripts/prototype-avatar-artwork.py --emit-transfer
      - name: Upload visual comparison and metrics
        uses: actions/upload-artifact@v4
        with:
          name: avatar-p2-artwork-proof
          path: .avatar-p2-qa/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
