name: Avatar P6 face candidates
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/author-avatar-face-candidates.py'
      - '.github/workflows/avatar-face-candidates.yml'
      - 'public/avatar/scenes/**'
      - 'public/avatar/materials/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avatar-face-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Author face for ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        source: [male, male-glasses, male-dark, male-dark-glasses, male-short, male-side, female, female-glasses, female-dark, female-dark-glasses, female-bob, female-bun]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline authoring dependencies
        run: python -m pip install numpy==2.2.6 Pillow==12.3.0 opencv-python-headless==4.12.0.88
      - name: Produce geometry and aligned material coverage
        env:
          SOURCE: ${{ matrix.source }}
        run: python scripts/author-avatar-face-candidates.py --name "$SOURCE" --emit
      - name: Upload face review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-p6-face-${{ matrix.source }}
          path: avatar-face-review/
          if-no-files-found: error
          retention-days: 7
