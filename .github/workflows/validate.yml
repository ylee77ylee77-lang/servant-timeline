name: Validate application and database

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Changed-code lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run lint on changed code
        id: lint
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          if [[ -n "${PR_BASE_SHA}" && -n "${PR_HEAD_SHA}" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          else
            base_sha="$(git merge-base origin/main HEAD)"
            head_sha="HEAD"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMRT "${base_sha}" "${head_sha}" -- \
              '*.js' '*.jsx' '*.ts' '*.tsx'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed JavaScript or TypeScript files." > lint.log
            exit_code=0
          else
            printf 'Linting changed files:\n%s\n' "${changed_files[*]}" > lint.log
            npx eslint "${changed_files[@]}" >> lint.log 2>&1
            exit_code=$?
          fi

          cat lint.log
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint diagnostics
        if: steps.lint.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: lint.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when lint failed
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1

      - name: Run Node unit tests
        run: npm test

      - name: Verify avatar material sources and rendering
        run: |
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/build-avatar-material-masks.mjs --check
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/verify-avatar-material-rendering.mjs avatar-material-rendering-proof

      - name: Upload avatar rendering review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-material-rendering
          path: avatar-material-rendering-proof
          if-no-files-found: ignore
          retention-days: 7

      - name: Run production build
        run: npm run build

  database:
    name: Database migrations and authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Normalize disposable local Supabase config for stable CLI
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^\[local_smtp\]$/[inbucket]/' supabase/config.toml
          # In this CLI version auth.email.enable_signup also toggles the
          # provider itself. Enable password login in the disposable runner,
          # while retaining the global prohibition on self-service signup.
          # Never push this config to a remote project.
          sed -i '/^\[auth\.email\]$/,/^\[/s/^enable_signup = false$/enable_signup = true/' supabase/config.toml
          python3 -c 'import tomllib; a=tomllib.load(open("supabase/config.toml","rb"))["auth"]; assert a["enable_signup"] is False and a["email"]["enable_signup"] is True'

      - name: Generate and verify the candidate migration locally
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          # This step creates a migration ONLY in the temporary CI checkout.
          # It exercises the real migration path instead of applying staged
          # SQL after the stack has already started.
          if ! compgen -G 'supabase/migrations/*_background_task_reminders.sql' >/dev/null; then
            supabase migration new background_task_reminders
            mapfile -t candidates < <(find supabase/migrations -maxdepth 1 -name '*_background_task_reminders.sql' -type f)
            test "${#candidates[@]}" -eq 1
            candidate="${candidates[0]}"
            {
              printf '%s\n\n' '-- Review candidate: schema only; no scheduler or push is enabled.'
              cat supabase/staged/background_task_reminders.sql
              printf '\n'
              cat supabase/staged/background_task_reminder_cron.sql
            } > "$candidate"
            echo "Generated migration candidate: $(basename "$candidate")"
            echo "REMINDER_MIGRATION_CANDIDATE=$candidate" >> "$GITHUB_ENV"
          fi

      - name: Upload migration candidate for review
        if: env.REMINDER_MIGRATION_CANDIDATE != ''
        uses: actions/upload-artifact@v4
        with:
          name: background-reminder-migration-candidate
          path: ${{ env.REMINDER_MIGRATION_CANDIDATE }}
          if-no-files-found: error
          retention-days: 7

      - name: Start isolated local Supabase and apply migrations
        id: supabase_start
        shell: bash
        run: |
          set +e
          supabase start > supabase-start.log 2>&1
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          tail -n 120 supabase-start.log
          exit 0

      - name: Upload Supabase startup diagnostics
        if: steps.supabase_start.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-diagnostics
          path: supabase-start.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when local Supabase did not start
        if: steps.supabase_start.outputs.exit_code != '0'
        run: exit 1

      - name: Export ephemeral local database URL
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "DATABASE_URL=${DB_URL}" >> "$GITHUB_ENV"

      - name: Verify migration history in local database
        run: supabase migration list --local

      - name: Run database verification scripts
        id: database_tests
        shell: bash
        run: |
          set +e
          : > database-tests.log
          mapfile -t test_files < <(find supabase/tests -type f -name '*.sql' | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo "No database verification scripts found." | tee -a database-tests.log
            exit_code=1
          else
            exit_code=0
            for test_file in "${test_files[@]}"; do
              echo "===== ${test_file} =====" | tee -a database-tests.log
              psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$test_file" 2>&1 | tee -a database-tests.log
              command_status=${PIPESTATUS[0]}
              if (( command_status != 0 )); then
                exit_code=${command_status}
                break
              fi
            done
          fi
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload database test diagnostics
        if: steps.database_tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: database-test-diagnostics
          path: database-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when database verification failed
        if: steps.database_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Set up Node.js for reminder integration
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install local integration dependencies
        run: npm ci --ignore-scripts

      - name: Verify full background reminder path in disposable Supabase
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export LOCAL_SUPABASE_URL="$API_URL"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export LOCAL_SUPABASE_ANON_KEY="$ANON_KEY"
          export BACKGROUND_REMINDER_LOCAL_TEST=1
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types scripts/verify-background-reminders-integration.mjs

      - name: Review local database security advisors
        shell: bash
        run: |
          set -euo pipefail
          supabase db advisors --help
          # Existing unrelated advisory findings do not alter release policy.
          # Review findings for the new reminder objects before approval.
          supabase db advisors --local --type security --fail-on none

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
