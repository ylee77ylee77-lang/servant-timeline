name: Validate application and database

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Normalize local Supabase config for stable CLI
        run: sed -i 's/^\[local_smtp\]$/[inbucket]/' supabase/config.toml

      - name: Start isolated local Supabase and apply migrations
        id: supabase_start
        shell: bash
        run: |
          set +e
          supabase start > supabase-start.log 2>&1
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          tail -n 120 supabase-start.log
          exit 0

      - name: Upload Supabase startup diagnostics
        if: steps.supabase_start.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-diagnostics
          path: supabase-start.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when local Supabase did not start
        if: steps.supabase_start.outputs.exit_code != '0'
        run: exit 1

      - name: Export ephemeral local Supabase settings
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "DATABASE_URL=${DB_URL}"
          } >> "$GITHUB_ENV"

      - name: Run database verification scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t test_files < <(find supabase/tests -type f -name '*.sql' | sort)
          if (( ${#test_files[@]} == 0 )); then
            echo "No database verification scripts found." >&2
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$test_file"
            echo "::endgroup::"
          done

      - name: Run lint
        run: npm run lint

      - name: Run production build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
